# Copy to /etc/nginx/nginx.conf (or include from nginx.conf) and replace the
# two upstream addresses with the private addresses of independent API instances.
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    # Keep telemetry connections inexpensive without retaining them forever.
    sendfile on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    upstream telemetry_api {
        least_conn;
        keepalive 256;
        server 10.0.0.11:5000 max_fails=3 fail_timeout=10s;
        server 10.0.0.12:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80 backlog=4096 reuseport;
        server_name _;

        location /api/ {
            proxy_pass http://telemetry_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
