# Production-safe Redis baseline for telemetry ingestion.
# Size maxmemory for the configured recovery window after measuring real packet size.
appendonly yes
appendfsync everysec
maxmemory 4gb
maxmemory-policy noeviction
# Alert before 80% maxmemory, on rejected XADDs, unavailable readiness checks,
# stream pending count/age, worker failures, and MySQL backup failures.
